name: Build and test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: windows-latest
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build RevitAddin.slnx --configuration Release_2025 -p:Platform=x64 /nologo
